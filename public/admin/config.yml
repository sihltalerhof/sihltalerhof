backend:
  name: github
  repo: sihltalerhof/sihltalerhof
  branch: main
  # Muss auf die Worker-URL aus cms-oauth-worker/ zeigen (ohne /callback),
  # siehe cms-oauth-worker/README.md.
  base_url: https://sihltalerhof-cms-auth.example.workers.dev
  auth_endpoint: auth

# Erlaubt lokales Testen der Bearbeitungsoberfläche ohne den Worker:
# `npx decap-server` in einem zweiten Terminal starten, dann /admin/ aufrufen.
local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Seiteninhalte"
    files:
      - file: "src/content/pages/home.md"
        label: "Startseite"
        name: "home"
        fields:
          - { label: "Titel / Slogan", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }

      - file: "src/content/pages/ueber-uns.md"
        label: "Über uns"
        name: "ueber-uns"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }

      - file: "src/content/pages/direktvermarktung.md"
        label: "Direktvermarktung"
        name: "direktvermarktung"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - {
              label: "Überschrift über den Terminen",
              name: "intro",
              widget: "string",
              required: false,
            }
          - { label: "Text (nach den Terminen)", name: "body", widget: "markdown" }

      - file: "src/content/pages/hofladen.md"
        label: "Hofladen"
        name: "hofladen"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }

  - name: "termine"
    label: "Direktvermarktung – Termine"
    folder: "src/content/termine"
    create: true
    delete: true
    identifier_field: "datum"
    fields:
      - {
          label: "Datum",
          name: "datum",
          widget: "datetime",
          date_format: "DD.MM.YYYY",
          time_format: false,
        }
      - { label: "Uhrzeit", name: "uhrzeit", widget: "string", default: "18:00" }

  - name: "notices"
    label: "Zeitlich begrenzte Hinweise"
    folder: "src/content/notices"
    create: true
    delete: true
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - label: "Auf welcher Seite?"
        name: "page"
        widget: "select"
        options:
          - { label: "Home", value: "home" }
          - { label: "Über uns", value: "ueber-uns" }
          - { label: "Direktvermarktung", value: "direktvermarktung" }
          - { label: "Hofladen", value: "hofladen" }
      - {
          label: "Sichtbar ab (leer = sofort)",
          name: "from",
          widget: "datetime",
          required: false,
        }
      - {
          label: "Sichtbar bis (leer = unbegrenzt)",
          name: "until",
          widget: "datetime",
          required: false,
        }
      - { label: "Text", name: "body", widget: "markdown" }
